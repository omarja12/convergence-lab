<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0f172a"/>
  <!-- convergence funnel: steps narrowing to a point -->
  <line x1="14" y1="48" x2="50" y2="48" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="18" y1="40" x2="46" y2="40" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <line x1="22" y1="32" x2="42" y2="32" stroke="#2563eb" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- funnel outline -->
  <path d="M12 52 L 32 10 L 52 52" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- convergence point -->
  <circle cx="32" cy="10" r="3.5" fill="#2563eb"/>
  <!-- baseline -->
  <line x1="8" y1="52" x2="56" y2="52" stroke="#1e293b" stroke-width="1.5"/>
</svg>
